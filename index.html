<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liga Elite España</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#07142d;
    color:white;
}

header{
    text-align:center;
    padding:20px 20px 40px 20px;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-bottom:30px;
}

.menu-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    padding:10px;
    transition:0.3s;
}

.menu-btn:hover{
    color:#d4af37;
}

.menu-btn img{
    width:26px;
    height:26px;
}

.logo-principal{
    width:260px;
    margin-bottom:20px;
}

.titulo{
    font-size:42px;
    font-weight:bold;
    color:white;
    margin-bottom:10px;
}

.subtitulo{
    color:#d4af37;
    font-size:18px;
}

#contenido{
    width:90%;
    max-width:1200px;
    margin:0 auto 50px auto;
    background:white;
    color:#222;
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    min-height:450px;
}

#contenido h2{
    color:#b8860b;
    margin-bottom:20px;
}

#contenido p{
    line-height:1.8;
}

.tarjeta{
    background:#f5f5f5;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
}

footer{
    text-align:center;
    padding:20px;
    color:#999;
}

</style>
</head>

<body>

<header>

<nav>

<button class="menu-btn" onclick="mostrar('competicion')">
<img src="Goalunited.png">
<span>COMPETICIÓN</span>
</button>

<button class="menu-btn" onclick="mostrar('participantes')">
<img src="escudo.png">
<span>PARTICIPANTES</span>
</button>

<button class="menu-btn" onclick="mostrar('grupos')">
<img src="grupos.png">
<span>FASE DE GRUPOS</span>
</button>

<button class="menu-btn" onclick="mostrar('eliminatorias')">
<img src="eliminatorias.png">
<span>FASE ELIMINATORIAS</span>
</button>

<button class="menu-btn" onclick="mostrar('palmares')">
<img src="trofeo.png">
<span>PALMARÉS</span>
</button>

</nav>

<img src="logo.png" class="logo-principal">

<div class="titulo">LIGA ELITE ESPAÑA</div>

<div class="subtitulo">
32 participantes · 8 grupos · Eliminatorias directas
</div>

</header>

<div id="contenido">

<h2>Bienvenido a la Liga Elite España</h2>

<p>
Selecciona una pestaña superior para consultar la información del torneo.
</p>

<div class="tarjeta">
🏆 Primera edición oficial de la competición.
</div>

</div>

<footer>
Liga Elite España © 2026
</footer>

<script>

function mostrar(seccion){

let contenido=document.getElementById("contenido");

if(seccion=="competicion"){
contenido.innerHTML=`

<h2>COMPETICIÓN</h2>

<p>
La Liga Elite España reúne a 32 participantes distribuidos en 8 grupos de 4 equipos.
</p>

<div class="tarjeta">
⚽ Clasifican los dos primeros de cada grupo.
</div>

<div class="tarjeta">
🏆 Fase eliminatoria desde octavos hasta la gran final.
</div>

`;
}

if(seccion=="participantes"){
contenido.innerHTML=`

<h2>PARTICIPANTES</h2>

<p>
Aquí aparecerán los 32 participantes de la competición.
</p>

`;

}

if(seccion=="grupos"){
contenido.innerHTML=`

<h2>FASE DE GRUPOS</h2>

<p>
Aquí podrás mostrar los grupos A, B, C, D, E, F, G y H.
</p>

`;

}

if(seccion=="eliminatorias"){
contenido.innerHTML=`

<h2>FASE ELIMINATORIAS</h2>

<p>
Aquí aparecerá el cuadro de octavos, cuartos, semifinales y final.
</p>

`;

}

if(seccion=="palmares"){
contenido.innerHTML=`

<h2>PALMARÉS</h2>

<p>
Historial de campeones de la Liga Elite España.
</p>

<div class="tarjeta">
🥇 Campeón: Pendiente
</div>

<div class="tarjeta">
🥈 Subcampeón: Pendiente
</div>

`;

}

}

</script>

</body>
</html>
