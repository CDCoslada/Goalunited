<title>Liga Elite España</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#07142d;
color:white;
}

header{
text-align:center;
padding:20px;
}

nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin-bottom:25px;
}

.menu-btn{
display:flex;
align-items:center;
gap:8px;
background:none;
border:none;
color:white;
cursor:pointer;
font-size:16px;
font-weight:bold;
padding:10px;
transition:0.3s;
}

.menu-btn:hover{
color:#d4af37;
}

.menu-btn img{
width:26px;
height:26px;
}

.logo-principal{
width:260px;
margin-bottom:15px;
}

.titulo{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.subtitulo{
color:#d4af37;
font-size:18px;
}

#contenido{
width:90%;
max-width:1200px;
margin:0 auto 50px auto;
background:white;
color:#222;
border-radius:20px;
padding:35px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
min-height:500px;
}

#contenido h2{
color:#b8860b;
margin-bottom:20px;
}

#contenido h3{
margin-bottom:10px;
color:#07142d;
}

.tarjeta{
background:#f5f5f5;
border-radius:15px;
padding:20px;
margin-top:20px;
}

.tarjetas{
display:flex;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
}

.tarjeta-numero{
background:#f5f5f5;
border-radius:15px;
padding:20px;
flex:1;
min-width:250px;
text-align:center;
}

.tarjeta-numero h1{
font-size:40px;
color:#b8860b;
}

.equipo{
background:#f5f5f5;
border-radius:12px;
padding:15px;
flex:1;
min-width:250px;
border-left:5px solid #d4af37;
}

.equipo strong{
display:block;
font-size:16px;
margin-bottom:5px;
}

footer{
text-align:center;
padding:20px;
color:#999;
}

</style>

</head>

<body>

<header>

<nav>
  
<button class="menu-btn" onclick="mostrar('inicio')">

</button>

<button class="menu-btn" onclick="mostrar('grupos')">

<button class="menu-btn" onclick="mostrar('eliminatorias')">

<button class="menu-btn" onclick="mostrar('palmares')">

</nav>

<img src="logo.png" class="logo-principal">

<div class="subtitulo">
32 participantes · 8 grupos · Eliminatorias directas
</div>

<div id="contenido">

</div>

</div>

<footer>

<div>
Liga Elite España © 2026
</div>

margin-top:10px;
color:#d4af37;
font-weight:bold;
font-size:16px;
">
👁️ Cargando visitas...
</div>
</footer>

<script>
fetch('https://api.countapi.xyz/hit/ligaeliteespana/visitas')
.then(response => response.json())
.then(data => {
document.getElementById('contador-visitas').innerHTML =
'👁️ Visitas totales: ' + data.value;
})
.catch(() => {
document.getElementById('contador-visitas').innerHTML =
'👁️ Visitas no disponibles';
});
