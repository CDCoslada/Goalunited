<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liga Elite España</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#07142d;
    color:white;
}

header{
    text-align:center;
    padding:20px 20px 30px 20px;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-bottom:25px;
}

.menu-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    padding:10px;
    transition:0.3s;
}

.menu-btn:hover{
    color:#d4af37;
}

.menu-btn img{
    width:26px;
    height:26px;
}

.logo-principal{
    width:260px;
    margin-bottom:15px;
}

.titulo{
    font-size:42px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitulo{
    color:#d4af37;
    font-size:18px;
}

#contenido{
    width:90%;
    max-width:1200px;
    margin:0 auto 50px auto;
    background:white;
    color:#222;
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    min-height:500px;
}

#contenido h2{
    color:#b8860b;
    margin-bottom:20px;
}

#contenido h3{
    color:#07142d;
    margin-bottom:10px;
}

#contenido p{
    line-height:1.8;
}

.tarjeta{
    background:#f5f5f5;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
}

.tarjetas{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.tarjeta-numero{
    flex:1;
    min-width:220px;
    background:#f5f5f5;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.tarjeta-numero h1{
    color:#b8860b;
    font-size:42px;
}

footer{
    text-align:center;
    padding:20px;
    color:#999;
}

</style>
</head>

<body>

<header>

<nav>

<button class="menu-btn" onclick="mostrar('competicion')">
<img src="Goalunited.png">
<span>COMPETICIÓN</span>
</button>

<button class="menu-btn" onclick="mostrar('participantes')">
<img src="escudo.png">
<span>PARTICIPANTES</span>
</button>

<button class="menu-btn" onclick="mostrar('grupos')">
<img src="grupos.png">
<span>FASE DE GRUPOS</span>
</button>

<button class="menu-btn" onclick="mostrar('eliminatorias')">
<img src="eliminatorias.png">
<span>FASE ELIMINATORIAS</span>
</button>

<button class="menu-btn" onclick="mostrar('palmares')">
<img src="trofeo.png">
<span>PALMARÉS</span>
</button>

</nav>

<img src="logo.png" class="logo-principal">

<div class="titulo">LIGA ELITE ESPAÑA</div>

<div class="subtitulo">
32 participantes · 8 grupos · Eliminatorias directas
</div>

</header>

<div id="contenido">

<h2>Bienvenido a la Liga Elite España</h2>

<p>
Selecciona una pestaña superior para consultar la información del torneo.
</p>

<div class="tarjeta">
🏆 Primera edición oficial de la competición.
</div>

</div>

<footer>
Liga Elite España © 2026
</footer>

<script>

function mostrar(seccion){

let contenido=document.getElementById("contenido");

if(seccion=="competicion"){
contenido.innerHTML=`

<h2>🏆 COMPETICIÓN</h2>

<div class="tarjeta">

<h3>Bienvenida</h3>

<p>
La Liga Elite España reúne a los mejores managers de los servidores <b>Focos</b> y <b>Efecto</b>, enfrentándolos en una competición exclusiva basada en los resultados obtenidos durante la temporada anterior.
</p>

<p>
La competición está diseñada para disputarse sin interferir con los compromisos oficiales del juego.
</p>

</div>

<div class="tarjeta">

<h3>📅 Calendario Oficial</h3>

<p><b>Días de juego:</b> Martes y Domingo</p>

<p><b>Horario:</b> 18:00</p>

<p>
Todos los encuentros se disputarán coincidiendo con la inactividad de los partidos oficiales.
</p>

</div>

<h2 style="margin-top:30px;">🎟️ Sistema de Clasificación</h2>

<div class="tarjetas">

<div class="tarjeta-numero">
<h3>1ª DIVISIÓN FOCOS</h3>
<h1>12</h1>
<p>Clasificados</p>
</div>

<div class="tarjeta-numero">
<h3>1ª DIVISIÓN EFECTO</h3>
<h1>12</h1>
<p>Clasificados</p>
</div>

<div class="tarjeta-numero">
<h3>CAMPEONES 2ª DIVISIÓN</h3>
<h1>6</h1>
<p>Mejores campeones</p>
</div>

<div class="tarjeta-numero">
<h3>CAMPEONES DE COPA</h3>
<h1>2</h1>
<p>Plazas directas</p>
</div>

</div>

<div class="tarjeta">

<h3>⚠️ Casos Especiales</h3>

<p>
Si alguno de los campeones de Copa ya hubiera obtenido su clasificación mediante otro criterio, la plaza correspondiente será asignada al siguiente campeón de 2ª División disponible.
</p>

</div>

<div class="tarjeta">

<h3>🔄 Renuncias y Sustituciones</h3>

<p>
Si un manager clasificado rechaza su participación, la plaza será ofrecida al siguiente mejor clasificado disponible.
</p>

<p>
El proceso continuará sucesivamente hasta completar las 32 plazas de la competición.
</p>

</div>

`;
}

if(seccion=="participantes"){
contenido.innerHTML=`

<h2>👥 PARTICIPANTES</h2>

<div class="tarjeta">
Participantes pendientes de publicación.
</div>

`;

}

if(seccion=="grupos"){
contenido.innerHTML=`

<h2>📊 FASE DE GRUPOS</h2>

<div class="tarjeta">
La fase de grupos será publicada una vez completadas las inscripciones.
</div>

`;

}

if(seccion=="eliminatorias"){
contenido.innerHTML=`

<h2>🎯 FASE ELIMINATORIAS</h2>

<div class="tarjeta">
El cuadro eliminatorio se publicará tras la fase de grupos.
</div>

`;

}

if(seccion=="palmares"){
contenido.innerHTML=`

<h2>🏆 PALMARÉS</h2>

<div class="tarjeta">
🥇 Campeón: Pendiente
</div>

<div class="tarjeta">
🥈 Subcampeón: Pendiente
</div>

`;

}

}

</script>

</body>
</html>
